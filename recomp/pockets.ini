; libroger's settings for pockets (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; the game, the demo and the title use rows 0-191 (the play area and the
; panel), the map 57-141; the intro's comic panels reach row 207. The intro
; comes round again after each demo, and a gate fires only once, so one
; range covers both
rows = 0-207
